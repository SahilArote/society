name: Deploy Backend to AWS (society/api)

on:
  push:
    branches:
      - main
      - tushal
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Backend (dist to /society/api)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔨 Install Dependencies & Build Backend
        working-directory: backend
        run: |
          echo "Installing dependencies for compilation..."
          npm install
          chmod -R +x node_modules/.bin || true
          echo "Building TypeScript to dist..."
          npm run build

      - name: 📦 Bundle Only dist & Runtime Configs
        working-directory: backend
        run: |
          echo "Creating compressed tar bundle of backend..."
          tar -czf deploy-backend.tar.gz dist package.json package-lock.json ecosystem.config.js public
          ls -lh deploy-backend.tar.gz

      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" | tr -d '\r' > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Upload Bundle to Server
        run: |
          echo "Ensuring /home/${{ secrets.LIGHTSAIL_USER }}/society/api exists..."
          ssh -i ~/.ssh/lightsail.pem ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} "mkdir -p /home/${{ secrets.LIGHTSAIL_USER }}/society/api"

          echo "Uploading deploy-backend.tar.gz..."
          scp -i ~/.ssh/lightsail.pem backend/deploy-backend.tar.gz ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/home/${{ secrets.LIGHTSAIL_USER }}/society/api/deploy-backend.tar.gz

      - name: 🔄 Extract on Server & Reload PM2 (society-api)
        run: |
          ssh -i ~/.ssh/lightsail.pem ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} bash << 'EOF'
            set -e
            cd /home/ec2-user/society/api

            echo "📦 Extracting backend bundle..."
            tar -xzf deploy-backend.tar.gz
            rm -f deploy-backend.tar.gz

            # Copy parent .env if local .env doesn't exist yet
            if [ ! -f .env ] && [ -f /home/ec2-user/society/.env ]; then
              echo "📋 Copying existing .env from /home/ec2-user/society/.env..."
              cp /home/ec2-user/society/.env .env
            fi

            echo "📥 Updating production dependencies..."
            npm install --omit=dev

            echo "🔄 Managing PM2 processes..."
            # Stop legacy root process if present
            if pm2 describe society > /dev/null 2>&1; then
              echo "Stopping legacy 'society' root process..."
              pm2 delete society || true
            fi

            if pm2 describe society-api > /dev/null 2>&1; then
              echo "Reloading existing society-api process..."
              pm2 reload society-api --update-env
            else
              echo "Starting society-api via ecosystem.config.js..."
              pm2 start ecosystem.config.js
            fi
            pm2 save

            echo "🩺 Verifying Backend Health..."
            sleep 2
            curl -f http://localhost:5001/api/health
            echo ""
            echo "✅ Backend deployment successful! Running on port 5001 in /society/api."
          EOF
