name: Build Guard App (APK & AAB)

on:
  workflow_dispatch: # Allows manual build from Actions tab
  push:
    branches:
      - main
    paths:
      - 'nexguard/**'
      - '.github/workflows/build-guard-app.yml'

jobs:
  build-android:
    name: Build Guard App (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexguard

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 📦 Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-release-apk
          path: nexguard/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 📤 Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-release-aab
          path: nexguard/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

