name: Build iOS App

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nexgate_resident_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS (No Codesign for testing)
        run: flutter build ios --no-codesign --release

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ResidentApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resident-app-ipa
          path: nexgate_resident_app/ResidentApp.ipa

      - name: Upload Runner App
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: nexgate_resident_app/build/ios/iphoneos/Runner.app
